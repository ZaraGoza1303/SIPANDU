            type: string
            format: uuid
          description: ID pasien
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Berhasil mendapatkan log pemeriksaan pasien
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ExaminationWithStunting'
                      next_cursor:
                        type: string
                        nullable: true
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/pemeriksaan/update/{exam_id}:
    patch:
      tags:
        - Pemeriksaan
      summary: Edit data pemeriksaan
      description: "**Akses:** admin, bidan\n\nMengupdate data pemeriksaan. Semua field opsional (partial update). Sistem akan menghitung ulang hasil stunting jika data antropometri berubah."
      security:
        - BearerAuth: []
      parameters:
        - name: exam_id
          in: path
          required: true
