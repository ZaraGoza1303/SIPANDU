  # ──────────────────────────────────────────────────────────────────
  # DASHBOARD
  # ──────────────────────────────────────────────────────────────────
  /api/dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Statistik dashboard
      description: "**Akses:** admin, bidan\n\nMengembalikan data statistik: total pasien, total pemeriksaan (berdasarkan periode), jumlah stunting, jumlah normal, dan distribusi usia."
      security:
        - BearerAuth: []
      parameters:
        - name: periode
          in: query
          schema:
            type: string
            enum: [bulan_ini, bulan_lalu]
            default: bulan_ini
          description: "Periode data:\n- `bulan_ini` — data bulan ini (default)\n- `bulan_lalu` — data bulan sebelumnya"
          required: false
      responses:
        '200':
          description: Berhasil mengambil data dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/DashboardStats'
        '400':
          description: posyandu_id tidak ditemukan / periode tidak valid
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/dashboard/trend-stunting:
    get:
      tags:
        - Dashboard
      summary: Trend stunting
      description: "**Akses:** admin, bidan\n\nMengembalikan data trend stunting per bulan. Secara default menampilkan 6 bulan terakhir, bisa difilter per periode."
      security:
        - BearerAuth: []
      parameters:
        - name: periode
          in: query
          schema:
            type: string
            enum: [bulan_ini, bulan_lalu]
          description: "Filter periode:\n- (kosong) — 6 bulan terakhir (default)\n- `bulan_ini` — hanya bulan ini\n- `bulan_lalu` — hanya bulan sebelumnya"
          required: false
      responses:
        '200':
          description: Berhasil mengambil data trend stunting
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MonthlyTrendItem'
        '400':
          description: posyandu_id tidak ditemukan / periode tidak valid
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
